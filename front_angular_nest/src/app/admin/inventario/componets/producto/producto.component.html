<div class="grid">
    <div class="col-12">
        <div class="card px-6 py-6">

            <p-toolbar styleClass="mb-4">
                <ng-template pTemplate="left">
                    <div class="my-2">
                        <button pButton pRipple label="Nuevo"
                            icon="pi pi-plus"
                            class="p-button-success mr-2"
                            (click)="openNew()">
                        </button>
                    </div>
                </ng-template>

                <ng-template pTemplate="right">
                    <button pButton pRipple label="Export"
                        icon="pi pi-upload"
                        class="p-button-help"
                        (click)="dt.exportCSV()">
                    </button>
                </ng-template>
            </p-toolbar>

            <p-table #dt
                [value]="products"
                [columns]="cols"
                responsiveLayout="scroll"
                [rows]="10"
                [paginator]="true"
                [rowsPerPageOptions]="[10,20,30]"
                currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} productos"
                [showCurrentPageReport]="true"
                [globalFilterFields]="['nombre','precio','categoria_id','stock']"
                [rowHover]="true"
                dataKey="id">

                <ng-template pTemplate="caption">
                    <div class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
                        <h5 class="m-0">Administrar Productos</h5>

                        <span class="block mt-2 md:mt-0 p-input-icon-left">
                            <i class="pi pi-search"></i>

                            <input pInputText type="text"
                                (input)="dt.filterGlobal($any($event.target).value, 'contains')"
                                placeholder="Buscar..." />
                        </span>
                    </div>
                </ng-template>

                <ng-template pTemplate="header">
                    <tr>

                        <th pSortableColumn="id" style="width: 2rem">
                            Id
                            <p-sortIcon field="id"></p-sortIcon>
                        </th>

                        <th pSortableColumn="nombre">
                            Nombre
                            <p-sortIcon field="nombre"></p-sortIcon>
                        </th>

                        <th>
                            Imagen
                        </th>

                        <th pSortableColumn="precio">
                            Precio
                            <p-sortIcon field="precio"></p-sortIcon>
                        </th>

                        <th pSortableColumn="categoria_id">
                            Categoria
                            <p-sortIcon field="categoria_id"></p-sortIcon>
                        </th>

                        <th pSortableColumn="stock">
                            Stock
                            <p-sortIcon field="stock"></p-sortIcon>
                        </th>

                        <th>
                            Acciones
                        </th>

                    </tr>
                </ng-template>

                <ng-template pTemplate="body" let-product>
                    <tr>

                        <td style="width: 2rem">
                            <span class="p-column-title">Id</span>
                            {{ product.id }}
                        </td>

                        <td>
                            <span class="p-column-title">Nombre</span>
                            {{ product.nombre }}
                        </td>

                        <td>
                            <span class="p-column-title">Imagen</span>

                            <img [src]="product.imagen"
                                [alt]="product.nombre"
                                width="100"
                                height="70"
                                style="object-fit: cover;"
                                class="shadow-4" />
                        </td>

                        <td>
                            <span class="p-column-title">Precio</span>
                            {{ product.precio | currency:'USD' }}
                        </td>

                        <td>
                            <span class="p-column-title">Categoria</span>
                            {{ product.categoria_id }}
                        </td>

                        <td>
                            <span class="p-column-title">Stock</span>
                            {{ product.stock }}
                        </td>

                        <td>
                            <span class="p-column-title">Acciones</span>

                            <div class="flex">
                                <button pButton pRipple
                                    icon="pi pi-pencil"
                                    class="p-button-rounded p-button-success mr-2"
                                    (click)="editProduct(product)">
                                </button>

                                <button pButton pRipple
                                    icon="pi pi-trash"
                                    class="p-button-rounded p-button-warning"
                                    (click)="deleteProduct(product)">
                                </button>
                            </div>
                        </td>

                    </tr>
                </ng-template>

                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="7">
                            No se encontraron productos.
                        </td>
                    </tr>
                </ng-template>

            </p-table>

        </div>
    </div>
</div>
